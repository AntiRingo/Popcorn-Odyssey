<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏配置管理 · 爆米花：奥德赛</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-page"><main class="admin-shell">
<div class="admin-title"><div><small class="eyebrow">ODYSSEY / GAME CONFIGURATION</small><h1>游戏配置管理</h1><p>价格配置与全图鉴资料库</p></div><span class="admin-badge">基础价格 · 可编辑</span></div>
<div class="admin-intro">浏览全部原料和所有异变阶段的客人档案，不受游戏收录进度限制。</div>
<section class="price-settings" aria-labelledby="price-heading">
<h2 id="price-heading">基础价格配置</h2>
<p>价格单位为钱币 ◈，可填写 0–1,000,000 的整数。材料价格为每批采购价，批量保持不变；行情在基础价上浮动。增设机器每次递增 80，脱粒台与包装台每次递增 60。</p>
<p>保存到当前浏览器，适用于同一地址下的所有存档。保存后刷新游戏页面生效；营业中请先保存进度。</p>
<form id="price-form"><h3>升级基础价格</h3><div id="upgrade-prices" class="price-grid"></div><h3>材料基础价格</h3><div id="material-prices" class="price-grid"></div>
<div class="price-actions"><button type="submit" class="action">保存价格配置</button><button type="button" id="reset-prices" class="secondary">填入默认价格</button></div>
<p id="price-status" role="status" aria-live="polite"></p></form></section>
<nav class="codex-tabs" aria-label="图鉴分类"><button id="admin-ingredients" class="selected" aria-pressed="true">原料图鉴 · 5</button><button id="admin-guests" aria-pressed="false">客人图鉴 · 25</button></nav>
<div class="admin-filters"><label>搜索档案<input id="admin-search" type="search" placeholder="名称、特征或用途…"></label><label id="stage-filter" hidden>异变阶段<select id="admin-stage"><option value="all">全部阶段</option><option value="0">0 · 普通街坊</option><option value="1">1 · 细微违和</option><option value="2">2 · 异相显露</option><option value="3">3 · 形态分岔</option><option value="4">4 · 非人来客</option></select></label><span id="admin-count" role="status"></span></div>
<div id="admin-catalog" class="encyclopedia-grid"></div>
<footer>ODYSSEY FIELD ARCHIVE / 本页不会修改游戏存档或解锁进度</footer>
</main><script src="catalog-data.js"></script><script src="characters.js"></script><script src="admin.js"></script></body></html>
